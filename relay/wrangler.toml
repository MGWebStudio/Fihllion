# A second address for the game's server (worker/), for networks that block workers.dev.
# Deploy from this folder: npx wrangler pages deploy (uses the Wrangler login in worker/).
name = "fihllion-api"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[services]]
binding = "API"
service = "fihllion-counts"
